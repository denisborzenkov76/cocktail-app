name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Create project structure
      run: |
        mkdir -p app/src/main/java/com/example/cocktailapp/{data,ui/navigation,ui/screens,ui/theme,ui/viewmodel}
        mkdir -p app/src/main/res/values
        mkdir -p gradle/wrapper

    - name: Create settings.gradle.kts
      run: cat > settings.gradle.kts << 'EOF'
pluginManagement {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories { google(); mavenCentral() }
}
rootProject.name = "CocktailApp"
include(":app")
EOF

    - name: Create app/build.gradle.kts
      run: cat > app/build.gradle.kts << 'EOF'
plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
}
android {
    namespace = "com.example.cocktailapp"
    compileSdk = 34
    defaultConfig {
        applicationId = "com.example.cocktailapp"
        minSdk = 24
        targetSdk = 34
        versionCode = 1
        versionName = "1.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables { useSupportLibrary = true }
    }
    buildTypes {
        release { isMinifyEnabled = false }
    }
    compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = "17" }
    buildFeatures { compose = true }
    composeOptions { kotlinCompilerExtensionVersion = "1.5.5" }
    packaging { resources { excludes += "/META-INF/{AL2.0,LGPL2.1}" } }
}
dependencies {
    implementation("androidx.core:core-ktx:1.12.0")
    implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
    implementation("androidx.activity:activity-compose:1.8.2")
    implementation(platform("androidx.compose:compose-bom:2023.10.01"))
    implementation("androidx.compose.ui:ui")
    implementation("androidx.compose.ui:ui-graphics")
    implementation("androidx.compose.ui:ui-tooling-preview")
    implementation("androidx.compose.material3:material3")
    implementation("androidx.compose.material:material-icons-extended")
    implementation("androidx.compose.foundation:foundation-layout")
    implementation("androidx.navigation:navigation-compose:2.7.6")
    implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0")
    testImplementation("junit:junit:4.13.2")
    androidTestImplementation("androidx.test.ext:junit:1.1.5")
    androidTestImplementation("androidx.test.espresso:espresso-core:3.5.1")
    androidTestImplementation(platform("androidx.compose:compose-bom:2023.10.01"))
    androidTestImplementation("androidx.compose.ui:ui-test-junit4")
    debugImplementation("androidx.compose.ui:ui-tooling")
    debugImplementation("androidx.compose.ui:ui-test-manifest")
}
EOF

    - name: Create build.gradle.kts
      run: cat > build.gradle.kts << 'EOF'
plugins {
    id("com.android.application") version "8.2.0" apply false
    id("org.jetbrains.kotlin.android") version "1.9.20" apply false
}
EOF

    - name: Create gradle.properties
      run: cat > gradle.properties << 'EOF'
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
EOF

    - name: Create gradle-wrapper.properties
      run: cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
networkTimeout=10000
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF

    - name: Create AndroidManifest.xml
      run: cat > app/src/main/AndroidManifest.xml << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.example.cocktailapp">
    <application android:allowBackup="true" android:label="Коктейли" android:supportsRtl="true" android:theme="@android:style/Theme.Material.Light.NoActionBar">
        <activity android:name=".ui.MainActivity" android:exported="true" android:windowSoftInputMode="adjustResize">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>
EOF

    - name: Create strings.xml
      run: cat > app/src/main/res/values/strings.xml << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<resources><string name="app_name">Коктейли</string></resources>
EOF

    - name: Create Cocktail.kt
      run: cat > app/src/main/java/com/example/cocktailapp/data/Cocktail.kt << 'EOF'
package com.example.cocktailapp.data
data class Ingredient(val name: String, val amount: String, val isChecked: Boolean = false)
data class Cocktail(
    val id: Int, val name: String, val base: String, val imageEmoji: String,
    val color: Long, val ingredients: List<Ingredient>, val instructions: String,
    val glass: String, val garnish: String
)
EOF

    - name: Create Screen.kt
      run: cat > app/src/main/java/com/example/cocktailapp/ui/navigation/Screen.kt << 'EOF'
package com.example.cocktailapp.ui.navigation
sealed class Screen(val route: String) {
    object Main : Screen("main")
    object CocktailDetail : Screen("cocktail_detail/{cocktailId}") {
        fun createRoute(cocktailId: Int) = "cocktail_detail/$cocktailId"
    }
    object CocktailsManagement : Screen("cocktails_management")
    object CocktailEdit : Screen("cocktail_edit/{id}") {
        fun createRoute(id: String) = "cocktail_edit/$id"
    }
}
EOF

    - name: Create CocktailManager.kt
      run: cat > app/src/main/java/com/example/cocktailapp/data/CocktailManager.kt << 'EOF'
