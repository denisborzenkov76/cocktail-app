    - name: Create MainActivity.kt
      run: cat > app/src/main/java/com/example/cocktailapp/ui/MainActivity.kt << 'EOF'
package com.example.cocktailapp.ui
import android.os.Bundle
import androidx.activity.ComponentActivity
import androidx.activity.compose.setContent
import androidx.activity.enableEdgeToEdge
import com.example.cocktailapp.ui.navigation.NavGraph
import com.example.cocktailapp.ui.theme.CocktailAppTheme
class MainActivity : ComponentActivity() {
    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        enableEdgeToEdge()
        setContent { CocktailAppTheme { NavGraph() }
